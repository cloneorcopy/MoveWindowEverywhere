name: Windows build and tests

on:
  push:
    branches:
      - fix/thumbnails-fullscreen-restore
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MoveWindowEverywhere.sln
      - name: Build
        run: dotnet build MoveWindowEverywhere.sln -c Release --no-restore
      - name: Test
        run: dotnet test MoveWindowEverywhere.sln -c Release --no-build --no-restore
      - name: Publish portable single-file Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish src/MoveWindowEverywhere/MoveWindowEverywhere.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "${{ runner.temp }}/mwe-portable"
          $exe = Join-Path "${{ runner.temp }}/mwe-portable" "MoveWindowEverywhere.exe"
          if (-not (Test-Path $exe)) { throw "Publish did not produce MoveWindowEverywhere.exe" }
          $exeFile = Get-Item $exe
          if ($exeFile.Length -lt 1048576) { throw "Unexpectedly small published EXE: $($exeFile.Length)" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Write-Host "Published portable EXE: $($exeFile.Length) bytes"
      - name: Upload standalone EXE for PR testing
        id: portable_upload
        uses: actions/upload-artifact@v4
        with:
          name: MoveWindowEverywhere-win-x64-portable
          path: ${{ runner.temp }}/mwe-portable/MoveWindowEverywhere.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish clickable download in PR check summary
        shell: pwsh
        run: |
          $download = '${{ steps.portable_upload.outputs.artifact-url }}'
          $lines = @(
            '### Windows x64 compiled preview'
            ''
            "**[Download the self-contained EXE archive]($download)**"
            ''
            '- Contents: `MoveWindowEverywhere.exe` (Windows 10/11 x64, .NET 8, no runtime install required)'
            '- This build was tested using the Windows CI steps above.'
            '- The artifact is retained for 30 days; this is an unsigned PR preview, not a signed release.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
